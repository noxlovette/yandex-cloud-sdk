name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Check feature combinations
      run: |
        cargo check --features http
        cargo check --features kms
        cargo check --features logging
        cargo check --features ocr
        cargo check --features vision
        cargo check --features foundation-models,stt,tts,translate
        cargo check --all-targets --features full
