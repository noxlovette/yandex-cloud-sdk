[package]
name = "yandex-cloud-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Danila Volkov <noxlovette@proton.me>"]
description = "Unofficial async Rust SDK for Yandex Cloud's gRPC APIs (IAM, KMS, Logging, OCR, Vision)"
license = "MIT"
repository = "https://github.com/noxlovette/yandex-cloud-sdk"
homepage = "https://github.com/noxlovette/yandex-cloud-sdk"
documentation = "https://docs.rs/yandex-cloud-sdk"
readme = "README.md"
keywords = ["yandex", "yandex-cloud", "grpc", "cloud", "sdk"]
categories = ["api-bindings", "asynchronous"]
exclude = [".github/"]

[features]
# Nothing is on by default: opt in to the APIs you use. Each feature compiles that API's
# protobuf/gRPC code (and, for the first four, enables the matching `Client` helpers).
# Reach the others with `Client::channel`.
kms = []
logging = []
ocr = []
vision = []
foundation-models = []
stt = []
tts = []
translate = []
# Adds `SDKError::Http` (a `reqwest::Error` conversion) and pulls in reqwest. The SDK itself
# only speaks gRPC; enable this if you also do HTTP calls and want `?` to convert their errors.
http = ["dep:reqwest"]
# Every API in the vendored proto tree. Large: expect a long first compile.
full = [
    "kms",
    "logging",
    "ocr",
    "vision",
    "foundation-models",
    "stt",
    "tts",
    "translate",
]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "logging"
required-features = ["logging"]

[[example]]
name = "raw_client"
required-features = ["logging"]

[[example]]
name = "ocr"
required-features = ["ocr"]

[[example]]
name = "vision_search"
required-features = ["vision"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
jsonwebtoken = { version = "10.3.0", features = ["use_pem", "rust_crypto"] }
prost = "0.14.3"
prost-types = "0.14.3"
reqwest = { version = "0.13.2", features = ["json"], optional = true }
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1", features = ["sync"] }
tonic = { version = "0.14.5", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-prost-build = "0.14.5"
